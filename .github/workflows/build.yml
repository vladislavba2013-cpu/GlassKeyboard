name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack and prepare project
        run: |
          unzip -q GlassKeyboard.zip

          # 1. Переименовываем MainActivity.txt в MainActivity.kt
          if [ -f "GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.txt" ]; then
            mv GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.txt GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.kt
          fi

          # 2. Создаем иконку приложения
          mkdir -p GlassKeyboard/app/src/main/res/drawable
          cat << 'EOF' > GlassKeyboard/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://android.com"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#3DDC84" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M14,18h20v12h-20z"/>
          </vector>
          EOF

          # 3. Записываем полностью исправный AndroidManifest.xml
          cat << 'EOF' > GlassKeyboard/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GlassKeyboard">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PermissionActivity"
                      android:exported="false" />

                  <service
                      android:name=".KeyboardService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>
          </manifest>
          EOF

          # 4. Исправляем XML-ресурсы (method.xml, file_paths.xml, strings.xml, themes.xml)
          mkdir -p GlassKeyboard/app/src/main/res/xml
          cat << 'EOF' > GlassKeyboard/app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://android.com"
              android:settingsActivity="com.glasskb.MainActivity"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype
                  android:imeSubtypeLocale="ru_RU"
                  android:imeSubtypeMode="keyboard" />
              <subtype
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > GlassKeyboard/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://android.com">
              <cache-path name="shared_gifs" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          mkdir -p GlassKeyboard/app/src/main/res/values
          cat << 'EOF' > GlassKeyboard/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">GlassKeyboard</string>
          </resources>
          EOF

          cat << 'EOF' > GlassKeyboard/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.GlassKeyboard" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF

          # 5. Создаем gradle.properties
          cat << 'EOF' > GlassKeyboard/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 6. Создаем settings.gradle.kts
          cat << 'EOF' > GlassKeyboard/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GlassKeyboard"
          include(":app")
          EOF

          # 7. Создаем корневой build.gradle.kts
          cat << 'EOF' > GlassKeyboard/build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # 8. Создаем app/build.gradle.kts
          cat << 'EOF' > GlassKeyboard/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.glasskb"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.glasskb"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
                  viewBinding = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0")
              implementation("androidx.lifecycle:lifecycle-service:2.8.0")
              implementation("androidx.savedstate:savedstate-ktx:1.2.1")
              implementation(platform("androidx.compose:compose-bom:2024.05.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-gif:2.6.0")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: GlassKeyboard
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with: name: GlassKeyboard-APK
path: GlassKeyboard/app/build/outputs/apk/debug/app-debug.apk
