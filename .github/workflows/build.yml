name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          unzip -q GlassKeyboard.zip
          mv GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.txt GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.kt || true
          mkdir -p GlassKeyboard/app/src/main/res/drawable GlassKeyboard/app/src/main/res/xml GlassKeyboard/app/src/main/res/values
          A="android"
          echo "<vector xmlns:${A}=\"http://android.com\" ${A}:width=\"48dp\" ${A}:height=\"48dp\" ${A}:viewportWidth=\"48\" ${A}:viewportHeight=\"48\"><path ${A}:fillColor=\"#3DDC84\" ${A}:pathData=\"M0,0h48v48h-48z\"/></vector>" > GlassKeyboard/app/src/main/res/drawable/ic_launcher.xml
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns:${A}=\"http://android.com\"><uses-permission ${A}:name=\"android.permission.VIBRATE\"/><uses-permission ${A}:name=\"android.permission.INTERNET\"/><uses-permission ${A}:name=\"android.permission.RECORD_AUDIO\"/><uses-permission ${A}:name=\"android.permission.READ_MEDIA_IMAGES\"/><application ${A}:allowBackup=\"true\" ${A}:icon=\"@drawable/ic_launcher\" ${A}:label=\"@string/app_name\" ${A}:supportsRtl=\"true\" ${A}:theme=\"@style/Theme.GlassKeyboard\"><activity ${A}:name=\".MainActivity\" ${A}:exported=\"true\" ${A}:windowSoftInputMode=\"adjustResize\"><intent-filter><action ${A}:name=\"android.intent.action.MAIN\"/><category ${A}:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity><activity ${A}:name=\".PermissionActivity\" ${A}:exported=\"false\"/><service ${A}:name=\".KeyboardService\" ${A}:exported=\"true\" ${A}:label=\"@string/app_name\" ${A}:permission=\"android.permission.BIND_INPUT_METHOD\"><intent-filter><action ${A}:name=\"android.view.InputMethod\"/></intent-filter><meta-data ${A}:name=\"android.view.im\" ${A}:resource=\"@xml/method\"/></service><provider ${A}:name=\"androidx.core.content.FileProvider\" ${A}:authorities=\"\${applicationId}.fileprovider\" ${A}:exported=\"false\" ${A}:grantUriPermissions=\"true\"><meta-data ${A}:name=\"android.support.FILE_PROVIDER_PATHS\" ${A}:resource=\"@xml/file_paths\"/></provider></application></manifest>" > GlassKeyboard/app/src/main/AndroidManifest.xml
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><input-method xmlns:${A}=\"http://android.com\" ${A}:settingsActivity=\"com.glasskb.MainActivity\" ${A}:supportsSwitchingToNextInputMethod=\"true\"><subtype ${A}:imeSubtypeLocale=\"ru_RU\" ${A}:imeSubtypeMode=\"keyboard\"/><subtype ${A}:imeSubtypeLocale=\"en_US\" ${A}:imeSubtypeMode=\"keyboard\"/></input-method>" > GlassKeyboard/app/src/main/res/xml/method.xml
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><paths xmlns:${A}=\"http://android.com\"><cache-path name=\"shared_gifs\" path=\".\"/><files-path name=\"files\" path=\".\"/></paths>" > GlassKeyboard/app/src/main/res/xml/file_paths.xml
          echo '<resources><string name="app_name">GlassKeyboard</string></resources>' > GlassKeyboard/app/src/main/res/values/strings.xml
          echo '<resources><style name="Theme.GlassKeyboard" parent="Theme.Material3.DayNight.NoActionBar"/></resources>' > GlassKeyboard/app/src/main/res/values/themes.xml
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\n' > GlassKeyboard/gradle.properties
          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "GlassKeyboard"\ninclude(":app")\n' > GlassKeyboard/settings.gradle.kts
          printf 'plugins {\n id("com.android.application") version "8.4.0" apply false\n id("org.jetbrains.kotlin.android") version "1.9.23" apply false\n}\n' > GlassKeyboard/build.gradle.kts
          printf 'plugins {\n id("com.android.application")\n id("org.jetbrains.kotlin.android")\n}\nandroid {\n namespace = "com.glasskb"\n compileSdk = 34\n defaultConfig {\n applicationId = "com.glasskb"\n minSdk = 26\n targetSdk = 34\n versionCode = 1\n versionName = "1.0"\n }\n buildFeatures { compose = true; viewBinding = true }\n composeOptions { kotlinCompilerExtensionVersion = "1.5.11" }\n compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }\n kotlinOptions { jvmTarget = "17" }\n lint { abortOnError = false; checkReleaseBuilds = false }\n}\ndependencies {\n implementation("androidx.core:core-ktx:1.13.1")\n implementation("androidx.appcompat:appcompat:1.6.1")\n implementation("com.google.android.material:material:1.12.0")\n implementation("androidx.activity:activity-compose:1.9.0")\n implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")\n implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0")\n implementation("androidx.lifecycle:lifecycle-service:2.8.0")\n implementation("androidx.savedstate:savedstate-ktx:1.2.1")\n implementation(platform("androidx.compose:compose-bom:2024.05.00"))\n implementation("androidx.compose.ui:ui")\n implementation("androidx.compose.ui:ui-graphics")\n implementation("androidx.compose.ui:ui-tooling-preview")\n implementation("androidx.compose.material3:material3")\n implementation("androidx.compose.material:material-icons-extended")\n implementation("io.coil-kt:coil-compose:2.6.0")\n implementation("io.coil-kt:coil-gif:2.6.0")\n implementation("com.google.code.gson:gson:2.10.1")\n implementation("androidx.datastore:datastore-preferences:1.1.1")\n}\n' > GlassKeyboard/app/build.gradle.kts
          cat GlassKeyboard/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: GlassKeyboard
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-APK
          path: GlassKeyboard/app/build/outputs/apk/debug/app-debug.apk
