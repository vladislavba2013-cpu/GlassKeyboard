name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack and auto-fix project
        run: |
          unzip -q GlassKeyboard.zip

          # 1. Переименовываем MainActivity.txt в MainActivity.kt
          if [ -f "GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.txt" ]; then
            mv GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.txt GlassKeyboard/app/src/main/java/com/glasskb/MainActivity.kt
          fi

          # 2. Создаем базовую векторную иконку, так как папок mipmap/drawable нет в архиве
          mkdir -p GlassKeyboard/app/src/main/res/drawable
          cat << 'XMLEOF' > GlassKeyboard/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://android.com"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#3DDC84" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M14,18h20v12h-20z"/>
          </vector>
          XMLEOF
          cp GlassKeyboard/app/src/main/res/drawable/ic_launcher.xml GlassKeyboard/app/src/main/res/drawable/ic_launcher_round.xml

          # 3. Лечим все XML-файлы (возвращаем android: и меняем @mipmap на @drawable)
          python3 - << 'PYEOF'
          import glob, re

          attrs = [
              "name", "resource", "label", "icon", "roundIcon", "theme", "exported",
              "permission", "authorities", "grantUriPermissions", "settingsActivity",
              "supportsSwitchingToNextInputMethod", "isDefault", "imeSubtypeLocale",
              "imeSubtypeMode", "imeSubtypeExtraValue", "path", "allowBackup",
              "supportsRtl", "targetApi", "windowSoftInputMode", "launchMode",
              "configChanges", "value", "parent", "hardwareAccelerated", "resizeableActivity",
              "requestLegacyExternalStorage", "directBootAware", "description"
          ]
          pattern = re.compile(r'(?<![:\w])(' + '|'.join(attrs) + r')=')

          for path in glob.glob("GlassKeyboard/app/src/main/**/*.xml", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              # Заменяем @mipmap/ на @drawable/ чтобы не упало из-за отсутствия mipmap
              content = content.replace("@mipmap/", "@drawable/")
              
              # Возвращаем префикс android:
              fixed = pattern.sub(r'android:\1=', content)
              
              # Убираем случайное дублирование android:android:
              fixed = fixed.replace("android:android:", "android:")
              
              # Проверяем наличие xmlns:android в корневом теге
              if "android:" in fixed and "xmlns:android=" not in fixed:
                  fixed = re.sub(r'<(\w+)', r'<\1 xmlns:android="http://android.com"', fixed, count=1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(fixed)

          print("All XML files repaired successfully!")
          PYEOF

          # 4. Создаем gradle.properties
          cat << 'EOF' > GlassKeyboard/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 5. Создаем settings.gradle.kts
          cat << 'EOF' > GlassKeyboard/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GlassKeyboard"
          include(":app")
          EOF

          # 6. Создаем корневой build.gradle.kts
          cat << 'EOF' > GlassKeyboard/build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # 7. Создаем app/build.gradle.kts со всеми нужными библиотеками
          cat << 'EOF' > GlassKeyboard/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.glasskb"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.glasskb"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
                  viewBinding = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0")
              implementation("androidx.lifecycle:lifecycle-service:2.8.0")
              implementation("androidx.savedstate:savedstate-ktx:1.2.1")
              implementation(platform("androidx.compose:compose-bom:2024.05.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-gif:2.6.0")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: GlassKeyboard
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-APK
          path: GlassKeyboard/app/build/outputs/apk/debug/app-debug.apk
